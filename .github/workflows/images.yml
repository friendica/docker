name: Images

on:
  pull_request:
  workflow_run:
    workflows: ["update.sh"]
    branches: 
      - stable
    types:
      - completed

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:

  generate-jobs:
    name: Generate Jobs
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.generate-jobs.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker-library/bashbrew@v0.1.12
      - id: generate-jobs
        name: Generate Jobs
        run: |
          strategy="$(GITHUB_REPOSITORY=friendica "$BASHBREW_SCRIPTS/github-actions/generate.sh")"
          strategy="$("$BASHBREW_SCRIPTS/github-actions/munge-i386.sh" -c <<<"$strategy")"
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
          jq . <<<"$strategy" # sanity check / debugging aid
  test:
    needs: generate-jobs
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Docker 29.4.2 (ubuntu-26.04 runner) denies socketcall(2), which i386 glibc uses for all networking.
      # Use the seccomp/v0.2.3 default profile (Docker 29.4.3+), which allows it again.
      # Drop once actions/runner-images#14790 is fixed.
      - name: Allow socketcall for i386 containers
        if: endsWith(matrix.name, '(i386)')
        run: |
          version="$(docker version --format '{{.Server.Version}}')"
          if [ "$version" != '29.4.2' ]; then
            echo "Docker $version, nothing to do"
            exit 0
          fi
          sudo curl -fsSL -o /etc/docker/seccomp-v0.2.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          config="$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')"
          jq '."seccomp-profile" = "/etc/docker/seccomp-v0.2.3.json"' <<<"$config" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --rm i386/debian:trixie getent hosts deb.debian.org
      - name: Prepare Environment
        run: ${{ matrix.runs.prepare }}
      - name: Run update.sh script
        run: ./update.sh
      - name: Pull Dependencies
        run: ${{ matrix.runs.pull }}
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.runs.build }}
      - name: History ${{ matrix.name }}
        run: ${{ matrix.runs.history }}
      - name: Test ${{ matrix.name }}
        run: ${{ matrix.runs.test }}
      - name: '"docker images"'
        run: ${{ matrix.runs.images }}
